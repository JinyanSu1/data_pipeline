schema_version = "1.3"

# MUST stay at the top level of this file.  Nested inside any table it parses
# silently into that table, harbor collects nothing, and the verifier scores an
# empty submission as "never alarmed" (reward 0) with no error anywhere.
# /app/solution.py is collected from the agent container after the agent phase
# and re-materialised at the same path inside the separate verifier container.
artifacts = ["/app/solution.py"]

[task]
name = "harbor/early-warning-budget"
description = """
Online change-point detection on a 24-channel grouped stream. A regime break \
begins as a correlation build-up inside a single group, spreads, and only then \
becomes obvious system-wide. Raise the alarm during the build-up, without \
crying wolf across a calm prefix of up to 1700 timesteps."""
authors = [{ name = "jinyansu6", email = "jinyansu6@gmail.com" }]
keywords = [
    "time-series",
    "change-point-detection",
    "online",
    "anomaly-detection",
    "numpy",
]

[metadata]
difficulty = "hard"
tags = ["cpu-only", "offline", "stdlib+numpy", "single-container"]
# Reference (solution/solution.py) scores 0.482; starter scores 0.000.
# Every degenerate strategy in tests/degenerate.py scores <= 0.013.

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
# network_mode is deliberately NOT set anywhere in this file (environment,
# agent or verifier).  The default `public` baseline is required: the agent CLI
# installs itself under the [environment] baseline, and giving [agent] a
# different policy would need `dynamic_network_policy`, which the non-Docker
# backends do not have.

[agent]
# 3600 s is the same fact as the "You have 60 minutes" line in the
# "## Time budget" section of instruction.md.  If you change one, change the
# other -- the agent plans against the prose, the harness enforces this number.
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0
# A dedicated container built from tests/Dockerfile.  The agent's environment
# is torn down first, so nothing the agent left running can interfere with
# scoring, and the ground truth never exists in a container the agent touched.
environment_mode = "separate"
